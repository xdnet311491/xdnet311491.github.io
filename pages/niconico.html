<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニコニコ本社を爆発させる</title>
<meta name="description" content="ボタンを押すとニコニコ本社が爆発します。爆発させた回数と履歴も残ります">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:1.2rem;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;background:#0a0e2a;color:#eef0ff;max-width:760px;margin-inline:auto;
  -webkit-tap-highlight-color:transparent}
h1{font-size:1.3rem;margin:.2rem 0 1rem}
h2{font-size:.95rem;margin:.1rem 0 .6rem;color:#9fb0ff}
.card{background:#141a45;border:1px solid #2c3670;border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.8rem}
.dim{color:#9fb0ff;font-size:.8rem}

/* ---- 舞台 ---- */
.stage{position:relative;border-radius:10px;overflow:hidden;background:#05071a;border:1px solid #2c3670;line-height:0;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.stage img{display:block;width:100%;height:auto;transition:opacity 1.2s ease,filter .6s ease;-webkit-user-drag:none}
.stage.gone img{visibility:hidden}                       /* 爆発の瞬間: 本物の画像は消して、破片に置き換える */
.stage.ruined img{visibility:visible;clip-path:inset(74% 0 0 0);filter:grayscale(.9) brightness(.28) contrast(1.35)}
.stage.rebuild img{animation:rebuild 1.4s ease both}
@keyframes rebuild{from{opacity:0;filter:brightness(2.2)}to{opacity:1;filter:none}}
.stage.fuse img{animation:fuse .22s steps(2) infinite}   /* 点火前: 赤く点滅して震える */
@keyframes fuse{0%{filter:brightness(1);transform:translateX(-2px)}50%{filter:brightness(1.5) sepia(1) hue-rotate(-30deg) saturate(4);transform:translateX(2px)}100%{filter:brightness(1);transform:translateX(-2px)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#debris{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#debris i{position:absolute;display:block;will-change:transform,opacity}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 58%,#fff 0%,#fff3c4 22%,#ffb347 48%,rgba(255,120,30,0) 78%)}
.msg{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;line-height:1.4;font-weight:900;font-size:clamp(1rem,4.4vw,1.5rem);
  color:#fff;text-shadow:0 0 12px #000,0 2px 0 #000;pointer-events:none;padding:0 .6rem}

/* ---- ボタン ---- */
.ctl{display:flex;gap:.6rem;align-items:center;margin-top:.8rem;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.boom{flex:1 1 12rem;font-weight:900;font-size:1.25rem;letter-spacing:.06em;padding:.8rem 1.2rem;border:0;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,#ff7a3a,#e02a1a);box-shadow:0 4px 0 #8c1408,0 0 24px rgba(255,90,30,.35);transition:transform .08s,box-shadow .08s,filter .2s}
.boom:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8c1408,0 0 24px rgba(255,90,30,.35)}
.boom:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.sub{font-weight:700;padding:.55rem 1rem;border-radius:999px;border:1px solid #2c3670;background:#1d2660;color:#cfd6ff}
.sub[aria-pressed="false"]{opacity:.6}
.sub.small{padding:.35rem .8rem;font-size:.8rem;margin-top:.7rem}
.sub:focus-visible,.boom:focus-visible{outline:2px solid #ffe27a;outline-offset:3px}

/* ---- 爆発された歴 ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.7rem}
.stat{background:#0e1338;border:1px solid #2c3670;border-radius:10px;padding:.55rem .8rem;font-size:.8rem;color:#9fb0ff;line-height:1.4}
.stat b{display:block;font-size:1.5rem;color:#ffe27a;letter-spacing:.02em}
.hist{list-style:none;margin:0;padding:0;max-height:15rem;overflow:auto;border:1px solid #2c3670;border-radius:10px;background:#0e1338}
.hist li{display:flex;justify-content:space-between;gap:.6rem;padding:.4rem .8rem;font-size:.85rem;border-bottom:1px solid #1c2458}
.hist li:last-child{border-bottom:0}
.hist .no{color:#ff9f6a;font-weight:700}
.hist .empty{display:block;color:#9fb0ff;text-align:center;padding:.9rem}
@media (prefers-reduced-motion:reduce){.stage.fuse img{animation:none}}
</style>
</head>
<body>
<h1>ニコニコ本社を爆発させる</h1>

<div class="card">
  <div id="stage" class="stage">
    <img id="hq" src="../siryou/nikoniko.jpg" alt="ニコニコ本社" draggable="false">
    <div id="debris" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>
    <div id="msg" class="msg" aria-live="polite"></div>
  </div>
  <div class="ctl">
    <button id="boom" class="boom" type="button">💥 爆発させる</button>
    <button id="snd" class="sub" type="button" aria-pressed="true">🔊 音 ON</button>
  </div>
  <p id="note" class="dim" style="margin:.6rem 0 0" hidden></p>
</div>

<div class="card">
  <h2>爆発された歴</h2>
  <div class="stats">
    <div class="stat">あなたが爆発させた回数<b><span id="myN">0</span> 回</b></div>
    <div class="stat">みんなが爆発させた累計<b><span id="allN">…</span> 回</b></div>
  </div>
  <ol id="hist" class="hist"></ol>
  <p class="dim" style="margin:.6rem 0 0">「あなた」の履歴はこの端末のブラウザにだけ残ります。「みんなの累計」は、このページを開いた全員ぶんの合計です。</p>
  <button id="clr" class="sub small" type="button">自分の履歴を消す</button>
</div>

<script>
(() => {
  'use strict';
  // ================= 設定 =================
  const IMG_FILE = '../siryou/nikoniko.jpg';        // 画像の場所 (pages フォルダから見た位置)
  const GLOBAL_COUNTER = true;                      // true: 「みんなの累計」を出す (外部の数え上げサービス abacus を使う) / false: 出さない
  const GLOBAL_NS = 'xdnet311491-xdnet311491-github-io';  // サイトの訪問者カウンターと同じ名前空間
  const GLOBAL_KEY = 'niconico-explosions';         // 累計用のキー (サイトの訪問者数とは別カウンター)
  const STORE_KEY = 'niconico-explosions';          // 自分の履歴を端末に覚えるときの名前
  const SND_KEY = 'niconico-sound';
  const MAX_SAVE = 200, MAX_SHOW = 30;              // 保存する件数 / 画面に出す件数
  const FUSE_MS = 700;                              // ボタンを押してから爆発するまで
  const RUINS_MS = 3200;                            // 爆発してから再建が始まるまで
  // ========================================

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), hq = $('hq'), debris = $('debris'), cv = $('fx'), flash = $('flash');
  const msg = $('msg'), boom = $('boom'), snd = $('snd'), note = $('note');
  const cx = cv.getContext('2d');
  const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let busy = false, soundOn = true, actx = null;

  // ---------- 画像が無いときの代わり絵 ----------
  const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><rect width="800" height="450" fill="#9ed8ff"/>' +
    '<rect x="230" y="70" width="340" height="320" fill="#e9edf5" stroke="#6b7399" stroke-width="4"/>' +
    Array.from({ length: 24 }, (_, i) => `<rect x="${252 + (i % 6) * 52}" y="${94 + Math.floor(i / 6) * 40}" width="34" height="24" fill="#58a6e8"/>`).join('') +
    '<rect x="360" y="330" width="80" height="60" fill="#6b7399"/><rect x="0" y="390" width="800" height="60" fill="#5a6a7a"/>' +
    '<text x="400" y="52" font-size="38" font-weight="900" text-anchor="middle" fill="#1b2a55" font-family="sans-serif">ニコニコ本社</text></svg>');
  let usedPlaceholder = false;
  hq.addEventListener('error', () => {
    if (usedPlaceholder) return;
    usedPlaceholder = true;
    hq.src = PLACEHOLDER;
    note.hidden = false;
    note.textContent = '※ ' + IMG_FILE.replace('../', '') + ' が見つからないので、仮の絵を出しています。siryou フォルダに nikoniko.jpg を置いてください。';
  });

  // ---------- 音 (その場で作る。音声ファイルは不要) ----------
  try { soundOn = localStorage.getItem(SND_KEY) !== 'off'; } catch (e) { /* 保存できない環境 */ }
  const syncSnd = () => { snd.setAttribute('aria-pressed', String(soundOn)); snd.textContent = soundOn ? '🔊 音 ON' : '🔇 音 OFF'; };
  snd.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SND_KEY, soundOn ? 'on' : 'off'); } catch (e) { /* 保存できない環境 */ }
    syncSnd();
  });
  syncSnd();

  function ensureAudio() {   // ボタンを押した瞬間に呼ぶ (ブラウザの自動再生ルール対策)
    if (!soundOn) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume().catch(() => {});
    } catch (e) { actx = null; }
  }
  function boomSound() {
    if (!soundOn || !actx) return;
    try {
      const t = actx.currentTime, dur = 2.4, rate = actx.sampleRate, len = Math.floor(rate * dur);
      const buf = actx.createBuffer(1, len, rate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);   // ざーっという爆風のノイズ
      const src = actx.createBufferSource(); src.buffer = buf;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(6000, t); lp.frequency.exponentialRampToValueAtTime(110, t + dur);
      const g = actx.createGain(); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(lp); lp.connect(g); g.connect(actx.destination); src.start(t);
      const o = actx.createOscillator(); o.type = 'sine';                                              // どすんという低音
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(26, t + 0.8);
      const og = actx.createGain(); og.gain.setValueAtTime(1, t); og.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
      o.connect(og); og.connect(actx.destination); o.start(t); o.stop(t + 1.1);
    } catch (e) { /* 鳴らせなくても爆発はする */ }
  }

  // ---------- 火の玉・煙・火花・衝撃波 (canvas) ----------
  let parts = [], rings = [], raf = 0, last = 0, emitUntil = 0, W = 0, H = 0;
  function fit() {
    const r = stage.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function burst(x, y) {
    const k = RM ? 0.4 : 1, s = Math.max(0.5, W / 700);
    for (let i = 0; i < 150 * k; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(40, 520) * Math.pow(Math.random(), 0.6) * s;
      parts.push({ t: 'fire', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 * s, life: rnd(0.5, 1.5), age: 0, size: rnd(12, 48) * s, g: -30 });
    }
    for (let i = 0; i < 70 * k; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(20, 170) * s;
      parts.push({ t: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * s, life: rnd(1.6, 3.2), age: 0, size: rnd(22, 70) * s, g: -50 });
    }
    for (let i = 0; i < 90 * k; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(220, 850) * s;
      parts.push({ t: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 1.2), age: 0, size: rnd(1.5, 3.2), g: 700 * s });
    }
    rings.push({ x, y, age: 0, life: 0.7, max: Math.max(W, H) * 0.85 });
    rings.push({ x, y, age: 0, life: 1.0, max: Math.max(W, H) * 0.55 });
    kick();
  }
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (now < emitUntil) {   // 爆発後も、残骸から煙が上がり続ける
      const n = RM ? 1 : 2;
      for (let i = 0; i < n; i++) parts.push({ t: 'smoke', x: W * rnd(0.3, 0.7), y: H * rnd(0.8, 0.92), vx: rnd(-25, 25), vy: rnd(-90, -40), life: rnd(1.4, 2.6), age: 0, size: rnd(18, 44) * Math.max(0.5, W / 700), g: -20 });
    }
    cx.clearRect(0, 0, W, H);
    for (const r of rings) {
      r.age += dt; const k = r.age / r.life; if (k >= 1) continue;
      cx.globalCompositeOperation = 'lighter';
      cx.strokeStyle = `rgba(255,220,160,${(1 - k) * 0.9})`; cx.lineWidth = 2 + 12 * (1 - k);
      cx.beginPath(); cx.arc(r.x, r.y, r.max * (1 - Math.pow(1 - k, 3)), 0, Math.PI * 2); cx.stroke();
    }
    rings = rings.filter((r) => r.age < r.life);
    // 煙 → 火 → 火花 の順に描く (火が煙の上に来る)
    for (const pass of ['smoke', 'fire', 'spark']) {
      cx.globalCompositeOperation = pass === 'smoke' ? 'source-over' : 'lighter';
      for (const p of parts) {
        if (p.t !== pass) continue;
        p.age += dt; const k = p.age / p.life; if (k >= 1) continue;
        p.vy += p.g * dt; p.vx *= (1 - 1.4 * dt); p.vy *= (pass === 'spark' ? 1 : (1 - 1.4 * dt));
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (pass === 'smoke') {
          const r = p.size * (1 + k * 1.4), a = Math.sin(Math.min(1, k * 4) * Math.PI / 2) * (1 - k) * 0.55;
          cx.fillStyle = `rgba(${40 + 30 * (1 - k) | 0},${36 + 26 * (1 - k) | 0},${34 + 22 * (1 - k) | 0},${a})`;
          cx.beginPath(); cx.arc(p.x, p.y, r, 0, Math.PI * 2); cx.fill();
        } else if (pass === 'fire') {
          const r = p.size * (1 - k * 0.55), hue = 58 - 52 * k, lum = 62 - 22 * k, a = (1 - k) * 0.85;
          const gr = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          gr.addColorStop(0, `hsla(${hue + 8},100%,${lum + 25}%,${a})`);
          gr.addColorStop(1, `hsla(${hue},100%,${lum}%,0)`);
          cx.fillStyle = gr; cx.beginPath(); cx.arc(p.x, p.y, r, 0, Math.PI * 2); cx.fill();
        } else {
          cx.strokeStyle = `rgba(255,${200 - 120 * k | 0},80,${1 - k})`; cx.lineWidth = p.size;
          cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); cx.stroke();
        }
      }
    }
    parts = parts.filter((p) => p.age < p.life);
    if (parts.length || rings.length || now < emitUntil) raf = requestAnimationFrame(loop);
    else { raf = 0; cx.clearRect(0, 0, W, H); }
  }

  // ---------- 破片 (画像をタイルに割って飛ばす) ----------
  const anim = (el, kf, opt) => (el.animate ? el.animate(kf, opt) : null);
  function shatter(ox, oy) {
    debris.textContent = '';
    const r = hq.getBoundingClientRect(), s = stage.getBoundingClientRect();
    const w = r.width || s.width, h = r.height || s.height, left = r.width ? r.left - s.left : 0, top = r.width ? r.top - s.top : 0;
    const cols = RM ? 6 : 12, rows = Math.max(3, Math.round(cols * h / w));
    const tw = w / cols, th = h / rows, url = 'url("' + (hq.currentSrc || hq.src) + '")';
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const el = document.createElement('i');
      el.style.cssText = `left:${left + i * tw}px;top:${top + j * th}px;width:${tw + 0.6}px;height:${th + 0.6}px;` +
        `background-image:${url};background-size:${w}px ${h}px;background-position:${-i * tw}px ${-j * th}px;background-repeat:no-repeat`;
      debris.appendChild(el);
      const cxp = left + (i + 0.5) * tw, cyp = top + (j + 0.5) * th;
      const dx0 = cxp - ox, dy0 = cyp - oy, dist = Math.hypot(dx0, dy0) || 1;
      const power = rnd(0.6, 1.5) * (1.4 - dist / (Math.hypot(w, h) * 0.9) * 0.7);
      const dx = dx0 / dist * rnd(140, 420) * power * Math.max(0.5, w / 700);
      const dy = dy0 / dist * rnd(120, 360) * power * Math.max(0.5, w / 700) - rnd(40, 200);
      const rot = rnd(-540, 540), fall = h * rnd(0.5, 1.1), D = rnd(1300, 2300);
      anim(el, [
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${dx * 1.2}px,${dy + fall}px) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: D, easing: 'cubic-bezier(.15,.7,.35,1)', fill: 'forwards' });
    }
  }
  function shake(ms, amp) {
    if (RM) return;
    const kf = [{ transform: 'translate(0,0)' }];
    for (let i = 1; i <= 14; i++) { const d = 1 - i / 15; kf.push({ transform: `translate(${rnd(-amp, amp) * d}px,${rnd(-amp, amp) * d}px)` }); }
    kf.push({ transform: 'translate(0,0)' });
    anim(stage, kf, { duration: ms, easing: 'linear' });
  }

  // ---------- 爆発された歴 ----------
  const fmt = (ts) => {
    const d = new Date(ts), p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(a) ? a.filter((n) => typeof n === 'number' && isFinite(n)) : [];
    } catch (e) { return []; }
  }
  let records = load(), total = records.length;   // total = これまでの通算 (保存件数の上限を超えても数え続ける)
  try { const t = parseInt(localStorage.getItem(STORE_KEY + '-total'), 10); if (isFinite(t) && t >= records.length) total = t; } catch (e) { /* 保存できない環境 */ }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(records.slice(-MAX_SAVE))); localStorage.setItem(STORE_KEY + '-total', String(total)); return true; }
    catch (e) { return false; }
  }
  function render() {
    $('myN').textContent = total.toLocaleString('ja-JP');
    const ol = $('hist'); ol.textContent = '';
    if (!records.length) {
      const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'まだ一度も爆発していません';
      ol.appendChild(li); return;
    }
    const shown = records.slice(-MAX_SHOW).reverse();
    shown.forEach((ts, idx) => {
      const li = document.createElement('li');
      const no = document.createElement('span'); no.className = 'no'; no.textContent = '#' + (total - idx);
      const at = document.createElement('span'); at.textContent = fmt(ts);
      li.append(no, at); ol.appendChild(li);
    });
  }
  $('clr').addEventListener('click', () => {
    if (!records.length || !confirm('自分の爆発履歴を消しますか? (みんなの累計は減りません)')) return;
    records = []; total = 0; save(); render();
  });

  // みんなの累計 (abacus)。数えられなくても爆発は普通にできる
  const gUrl = (kind) => `https://abacus.jasoncameron.dev/${kind}/${encodeURIComponent(GLOBAL_NS)}/${encodeURIComponent(GLOBAL_KEY)}`;
  function showAll(v) { $('allN').textContent = typeof v === 'number' ? v.toLocaleString('ja-JP') : '—'; }
  function globalCall(kind) {
    if (!GLOBAL_COUNTER || !window.fetch) { showAll(null); return; }
    fetch(gUrl(kind), { cache: 'no-store' })
      .then((r) => { if (r.status === 404 && kind === 'get') return { value: 0 }; if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((j) => { const v = typeof j.value === 'number' ? j.value : j.count; if (typeof v !== 'number') throw new Error('bad'); showAll(v); })
      .catch(() => showAll(null));
  }

  // ---------- 本編 ----------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function explode() {
    if (busy) return;
    busy = true; boom.disabled = true;
    ensureAudio();
    msg.textContent = '';
    stage.classList.remove('rebuild', 'ruined', 'gone');
    stage.classList.add('fuse');
    msg.textContent = '…ピッ…ピッ…';
    await sleep(RM ? 300 : FUSE_MS);

    // ---- 爆発 ----
    stage.classList.remove('fuse');
    fit();
    const r = hq.getBoundingClientRect(), s = stage.getBoundingClientRect();
    const ox = r.left - s.left + r.width * 0.5, oy = r.top - s.top + r.height * 0.58;
    boomSound();
    if (!RM) anim(flash, [{ opacity: 1 }, { opacity: 0.85, offset: 0.2 }, { opacity: 0 }], { duration: 750, easing: 'ease-out' });
    shatter(ox, oy);
    stage.classList.add('gone');
    burst(ox, oy);
    shake(650, Math.max(6, W / 40));
    emitUntil = performance.now() + 2600;
    kick();

    records.push(Date.now()); total += 1;
    const saved = save();
    render();
    globalCall('hit');
    msg.textContent = `💥 ニコニコ本社は爆発しました (${total.toLocaleString('ja-JP')}回目)` + (saved ? '' : ' ※この端末では履歴を保存できません');

    // ---- 焼け跡 → 再建 ----
    await sleep(RM ? 800 : 1700);
    stage.classList.add('ruined');
    await sleep(Math.max(300, RUINS_MS - (RM ? 800 : 1700)));
    debris.textContent = '';
    msg.textContent = '🏗 ニコニコ本社を再建しました';
    stage.classList.remove('gone', 'ruined');
    stage.classList.add('rebuild');
    await sleep(1400);
    stage.classList.remove('rebuild');
    msg.textContent = '';
    boom.disabled = false; busy = false;
  }
  boom.addEventListener('click', explode);
  window.addEventListener('resize', () => { if (!busy) fit(); });

  render();
  fit();
  globalCall('get');
})();
</script>
</body>
</html>
