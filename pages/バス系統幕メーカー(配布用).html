<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バス系統幕メーカー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f3f3;--fg:#222;--card:#fff;--bd:#ccc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--card:#222;--bd:#444}}
:root[data-theme="dark"]{--bg:#161616;--fg:#eee;--card:#222;--bd:#444}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
h1{font-size:18px;margin:0 0 10px}
h2{font-size:13px;margin:14px 0 0;opacity:.7}
canvas{width:100%;display:block;border-radius:6px;background:#0c0c0c}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-top:6px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;gap:3px}
label.off{opacity:.35}
label.ck{flex-direction:row;align-items:center;gap:6px;font-size:14px}
input[type=text],select{padding:6px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--fg);font-size:15px}
input[type=color]{width:100%;height:34px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);padding:2px}
button{padding:8px 14px;border:0;border-radius:6px;background:#e8590c;color:#fff;font-size:14px;cursor:pointer;margin-top:12px}
</style></head><body data-mode="led">
<h1>バス系統幕メーカー</h1>
<canvas id="c"></canvas>
<h2>内容</h2>
<div class="panel">
 <label>表示パターン<select id="pat">
  <option value="A">A 系統番号+経由2行+行先</option>
  <option value="B">B 行先のみ(全幅)</option>
  <option value="C">C 行先+英字(下段)</option>
  <option value="D">D 系統番号+行先+英字</option>
  <option value="G">G 大小混在(前+大+後+英字)</option></select></label>
 <label id="l_num"><span>系統番号</span><input type="text" id="num"></label>
 <label id="l_m1"><span>経由 1行目</span><input type="text" id="m1"></label>
 <label id="l_m2"><span>経由 2行目</span><input type="text" id="m2"></label>
 <label id="l_dest"><span>行先(大)</span><input type="text" id="dest"></label>
 <label id="l_sub"><span>英字</span><input type="text" id="sub"></label>
</div>
<h2>表示方式</h2>
<div class="panel">
 <label>方式<select id="mode"><option value="led">LED(単色ドット)</option><option value="lcd">LCD(カラードット)</option></select></label>
 <label class="m_led">色<select id="col"><option value="#ff5a00">オレンジ</option><option value="#ffb000">アンバー</option><option value="#3dff6a">グリーン</option><option value="#ffffff">ホワイト</option><option value="#ff2a2a">レッド</option><option value="#4aa8ff">ブルー</option></select></label>
 <label class="m_lcd">行先・経由の色<input type="color" id="cDest" value="#7fe3ee"></label>
 <label class="m_lcd">系統番号の色<input type="color" id="cNum" value="#7fe3ee"></label>
 <label class="m_lcd">番号の枠・矢印の色<input type="color" id="cBox" value="#e0485a"></label>
 <label class="m_lcd">英字の色<input type="color" id="cSub" value="#7fe3ee"></label>
</div>
<button id="dl">PNGで保存</button>
<script>
const W=192,H=40,P=10,SS=4;
const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=W*P;c.height=H*P;
const big=document.createElement('canvas');big.width=W*SS;big.height=H*SS;
const bx=big.getContext('2d',{willReadFrequently:true});
const $=i=>document.getElementById(i);
const K={sl:()=>0,ws:()=>100,sc:()=>100,lsp:()=>0,th:()=>45,wt:()=>'700',fnt:()=>'gothic',shape:()=>'sq',bstyle:()=>V('mode')==='lcd'?'fill':'line'};
const V=i=>K[i]?K[i]():$(i).value;
const FB=',"Hiragino Sans","Yu Gothic",sans-serif';
const FONTS={gothic:'"Noto Sans JP"'+FB,round:'"M PLUS Rounded 1c"'+FB,mincho:'"Noto Serif JP","Yu Mincho",serif',dot:'DotGothic16,monospace'};
// 5x7 ドット英字フォント(列ごとのビット)
const FD=" :00 00 00 00 00|-:08 08 08 08 08|.:00 60 60 00 00|/:20 10 08 04 02|(:00 1C 22 41 00|):00 41 22 1C 00|':00 05 03 00 00|&:36 49 55 22 50|:00 36 36 00 00|0:3E 51 49 45 3E|1:00 42 7F 40 00|2:42 61 51 49 46|3:21 41 45 4B 31|4:18 14 12 7F 10|5:27 45 45 45 39|6:3C 4A 49 49 30|7:01 71 09 05 03|8:36 49 49 49 36|9:06 49 49 29 1E|A:7E 11 11 11 7E|B:7F 49 49 49 36|C:3E 41 41 41 22|D:7F 41 41 22 1C|E:7F 49 49 49 41|F:7F 09 09 09 01|G:3E 41 49 49 7A|H:7F 08 08 08 7F|I:00 41 7F 41 00|J:20 40 41 3F 01|K:7F 08 14 22 41|L:7F 40 40 40 40|M:7F 02 0C 02 7F|N:7F 04 08 10 7F|O:3E 41 41 41 3E|P:7F 09 09 09 06|Q:3E 41 51 21 5E|R:7F 09 19 29 46|S:46 49 49 49 31|T:01 01 7F 01 01|U:3F 40 40 40 3F|V:1F 20 40 20 1F|W:3F 40 38 40 3F|X:63 14 08 14 63|Y:07 08 70 08 07|Z:61 51 49 45 43";
const F5={};FD.split('|').forEach(s=>{if(s.length>3)F5[s[0]]=s.slice(2).split(' ').map(h=>parseInt(h,16))});
F5[':']=[0,0x36,0x36,0,0];
const SAMPLES={
 A:{num:'2',m1:'都元 磨田',m2:'台山 坂之上',dest:'動物園',sub:'ZOO'},
 B:{num:'',m1:'',m2:'',dest:'伊敷団地',sub:''},
 C:{num:'',m1:'',m2:'',dest:'スクール',sub:'SCHOOL BUS'},
 D:{num:'81',m1:'',m2:'',dest:'北山駅前',sub:'KITAYAMA STA.'},
 E:{num:'',m1:'経由 駅前通り',m2:'',dest:'市役所前',sub:''},
 F:{num:'',m1:'',m2:'',dest:'回送',sub:''},
 G:{num:'',m1:'すみません',m2:'です',dest:'回送中',sub:'SORRY OUT OF SERVICE'}
};
const USED={A:['num','m1','m2','dest','sub'],B:['dest'],C:['dest','sub'],D:['num','dest','sub'],E:['dest','m1'],F:['dest'],G:['m1','dest','m2','sub']};
const LAB={num:'系統番号',m1:'経由 1行目',m2:'経由 2行目',dest:'行先(大きい文字)',sub:'英字(自動でドット文字に)'};
const LABP={E:{m1:'下段の文字'},G:{m1:'前の小さい文字',m2:'後ろの小さい文字'}};
const IDS=['num','m1','m2','dest','sub'];
const G=new Uint32Array(W*H);let BL=true;
const hex=h=>parseInt(h.slice(1),16)|0x1000000;
const cssc={};const css=v=>cssc[v]||(cssc[v]='#'+(v&0xffffff).toString(16).padStart(6,'0'));
function meas(t,size,font,wt){bx.font=wt+' '+size*SS+'px '+font;if('letterSpacing' in bx)bx.letterSpacing='0px';return bx.measureText(t).width/SS*(V('ws')/100)}
function text(t,x,cy,maxW,size,col,al,font,wt,ls){
 if(!t)return;ls=ls||0;
 bx.clearRect(0,0,W*SS,H*SS);
 bx.font=wt+' '+size*SS+'px '+font;
 if('letterSpacing' in bx)bx.letterSpacing=ls*SS+'px';
 bx.textBaseline='middle';bx.fillStyle='#000';
 const m=Math.max(1,bx.measureText(t).width/SS-ls),sx=Math.min(V('ws')/100,maxW/m),w=m*sx;
 const x0=al==='c'?x+(maxW-w)/2:x,sk=Math.tan(V('sl')*Math.PI/180);
 bx.setTransform(sx,0,-sk,1,x0*SS,cy*SS);bx.fillText(t,0,0);bx.setTransform(1,0,0,1,0,0);
 const d=bx.getImageData(0,0,W*SS,H*SS).data,thr=SS*SS*255*(V('th')/100),SW=W*SS;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let s=0;for(let j=0;j<SS;j++){let q=((y*SS+j)*SW+x*SS)*4+3;for(let i=0;i<SS;i++,q+=4)s+=d[q]}
  if(s>=thr)G[y*W+x]=col===null?0:col;
 }
}
function eng(t,x,y,w,col,sp){
 const gl=[...(t||'').toUpperCase()].filter(ch=>F5[ch]),n=gl.length;if(!n)return;
 while(sp>1&&n*5+(n-1)*sp>w)sp--;
 let cx=Math.round(x+(w-(n*5+(n-1)*sp))/2);
 gl.forEach(ch=>{F5[ch].forEach((b,i)=>{for(let r=0;r<7;r++)if(b>>r&1){const X=cx+i,Y=y+r;if(X>=0&&X<W&&Y<H)G[Y*W+X]=col}});cx+=5+sp});
}
function rectO(x,y,w,h,col){for(let i=0;i<w;i++){G[y*W+x+i]=col;G[(y+h-1)*W+x+i]=col}for(let j=0;j<h;j++){G[(y+j)*W+x]=col;G[(y+j)*W+x+w-1]=col}}
function arrow(bw,d,col){for(let y=1;y<H-1;y++){const r=bw-Math.round(d*Math.abs(y-(H-1)/2)/((H-3)/2));for(let x=1;x<r;x++)G[y*W+x]=col}}
function layout(){
 const p=V('pat'),v={},k=V('sc')/100,wt=V('wt'),F=FONTS[V('fnt')],ls=+V('lsp'),lcd=V('mode')==='lcd';
 IDS.forEach(i=>v[i]=V(i));
 const main=hex(V('col')),cd=lcd?hex(V('cDest')):main,cn=lcd?hex(V('cNum')):main,cb=lcd?hex(V('cBox')):main,cs=lcd?hex(V('cSub')):main;
 const T=(t,x,cy,mw,s,col,al,l)=>text(t,x,cy,mw,Math.round(s),col,al||'c',F,wt,l||0);
 const hasSub=!!v.sub,dcy=hasSub?15:20;
 let rx=3;
 if((p==='A'||p==='D')&&v.num){
  const st=V('bstyle'),ns=st==='fill'?31:24,nw=meas(v.num,ns,F,wt),d=st==='fill'?11:0;
  const bw=Math.min(64,Math.max(26,Math.round(nw+10+d)));
  if(st==='line')rectO(1,1,bw-1,H-2,cb);else if(st==='fill')arrow(bw,d,cb);
  T(v.num,st==='none'?0:3,20.5,bw-6-d,ns,st==='fill'?(lcd?cn:null):cn);
  rx=bw+3;
 }
 if(p==='A'){
  const mid=v.m1||v.m2,dx=mid?rx+62:rx;
  T(v.m1,rx,10,58,14,cd,'l');T(v.m2,rx,29,58,14,cd,'l');
  T(v.dest,dx,dcy,W-dx-3,28*k,cd,'c',ls);eng(v.sub,dx,31,W-dx-3,cs,2);
 }else if(p==='B'){
  T(v.dest,4,20,184,36*k,cd,'c',ls);
 }else if(p==='C'){
  T(v.dest,4,dcy,184,28*k,cd,'c',ls);eng(v.sub,4,31,184,cs,3);
 }else if(p==='D'){
  T(v.dest,rx,dcy,W-rx-3,28*k,cd,'c',ls);eng(v.sub,rx,31,W-rx-3,cs,3);
 }else{
  const bs=Math.round(26*k),ss=Math.round(15*k),by=hasSub?14:19,parts=[[v.m1,ss,0],[v.dest,bs,1],[v.m2,ss,0]].filter(a=>a[0]),gap=2;
  const tot=parts.reduce((s,a)=>s+meas(a[0],a[1],F,wt),0)+gap*Math.max(0,parts.length-1),f=Math.min(1,184/Math.max(1,tot));
  let x=(W-tot*f)/2;
  parts.forEach(a=>{const w=meas(a[0],a[1],F,wt)*f,cy=a[2]?by:by+(bs-a[1])*f/2-1;
   text(a[0],x,cy,w+3,Math.round(a[1]*f),a[2]?cd:cd,'l',F,wt,0);x+=w+gap*f});
  eng(v.sub,4,31,184,cs,2);
 }
}
function draw(force){
 const lcd=V('mode')==='lcd',show=BL||force,inv=false,main=hex(V('col'));
 G.fill(0);if(show)layout();
 ctx.fillStyle=lcd?'#05080c':'#0c0c0c';ctx.fillRect(0,0,c.width,c.height);
 const offc=lcd?'#0e151d':'#242424',s=lcd?P-3:P-2,o=(P-s)/2,rd=V('shape')==='rd'&&!lcd;let last='';
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let v=G[y*W+x];if(inv)v=v?0:main;
  const f=v?css(v):offc;if(f!==last){ctx.fillStyle=f;last=f}
  const px=x*P+o,py=y*P+o;
  if(rd){ctx.beginPath();ctx.arc(px+s/2,py+s/2,s/2,0,7);ctx.fill()}
  else if(lcd&&ctx.roundRect){ctx.beginPath();ctx.roundRect(px,py,s,s,2);ctx.fill()}
  else ctx.fillRect(px,py,s,s);
 }
}
let tok=0;
async function render(){
 const t=++tok;draw();
 const all=IDS.map(i=>V(i)).join('')+'0123456789';
 try{await document.fonts.load(V('wt')+' 40px '+FONTS[V('fnt')],all)}catch(e){}
 if(t===tok)draw();
}
function fields(){
 const p=V('pat');
 IDS.forEach(i=>{const l=$('l_'+i);l.classList.toggle('off',!USED[p].includes(i));l.firstChild.textContent=(LABP[p]&&LABP[p][i])||LAB[i]});
}
function modeUI(){
 const lcd=V('mode')==='lcd';
 document.querySelectorAll('.m_led').forEach(e=>e.classList.toggle('off',lcd));
 document.querySelectorAll('.m_lcd').forEach(e=>e.classList.toggle('off',!lcd));
}
function setPat(fill){const p=V('pat');if(fill)IDS.forEach(i=>$(i).value=SAMPLES[p][i]);fields();render()}
$('pat').addEventListener('change',()=>setPat(true));
$('mode').addEventListener('change',()=>{modeUI();render()});
IDS.forEach(i=>$(i).addEventListener('input',render));
['col','cDest','cNum','cBox','cSub'].forEach(i=>$(i).addEventListener('input',render));
$('dl').onclick=()=>{draw(true);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='bus-sign.png';a.click()};
modeUI();setPat(true);
</script></body></html>
