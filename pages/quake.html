<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>強震モニター</title>
<meta name="description" content="防災科研の強震モニターを地図に重ねて表示。直近の震度情報つき">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:dark}
body{margin:0;padding:1rem;font-family:system-ui,sans-serif;background:#0a0e2a;color:#eef0ff;max-width:760px;margin-inline:auto}
a{color:#7df3ff}h1{font-size:1.3rem;margin:.2rem 0 .6rem}
#map{height:60vh;min-height:240px;border-radius:14px;border:1px solid #2c3670}
#eew{display:none;margin:.6rem 0;padding:.7rem 1rem;border-radius:12px;background:#7a1020;font-weight:700}
.dim{color:#9fb0ff;font-size:.8rem}#st{margin:.5rem 0}
ul{list-style:none;padding:0}li{background:#141a45;border:1px solid #2c3670;border-radius:12px;padding:.6rem .9rem;margin-bottom:.5rem;font-size:.9rem}
li b{font-size:1.1rem;color:#ffd479}
</style>
</head>
<body>
<h1>強震モニター</h1>
<div id="eew"></div>
<div id="map"></div>
<p id="st" class="dim">読み込み中…</p>
<h2 style="font-size:1rem">最近の震度情報(気象庁・P2P地震情報経由)</h2>
<ul id="q"><li>読み込み中…</li></ul>
<p class="dim">遊び用の非公式表示です。防災の判断には使わず、気象庁などの公式情報を見てください。画像: 防災科研 強震モニタ / 震度情報: P2P地震情報 / 地図: 地理院タイル</p>
<p id="bk"><a href="../">サイトに戻る</a></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const H='https://www.lmoni.bosai.go.jp/',B={W:128.626,E:145.921},Y0=1134.75,K=24.5402; // 画像のy = Y0 - K*緯度
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const stamp=d=>{const j=new Date(d.getTime()+324e5);return j.getUTCFullYear()+pad(j.getUTCMonth()+1)+pad(j.getUTCDate())+pad(j.getUTCHours())+pad(j.getUTCMinutes())+pad(j.getUTCSeconds())};
const url=(k,t)=>{const s=stamp(t);return k==='img'?`${H}img_svr/data/map_img/RealTimeImg/jma_s/${s.slice(0,8)}/${s}.jma_s.gif`:`${H}monitor/webservice/hypo/eew/${s}.json`};
const map=L.map('map',{center:[37.5,137.5],zoom:5,minZoom:4,maxZoom:10});
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'地理院タイル'}).addTo(map);
// 強震モニターの画像は緯度に比例しているので、1行ずつ地図(メルカトル)に合わせて描き直す
const cv=document.createElement('canvas');cv.style.cssText='position:absolute;left:0;top:0;z-index:450;pointer-events:none';
map.getContainer().appendChild(cv);let img=null;
function draw(){
  const s=map.getSize();cv.width=s.x;cv.height=s.y;if(!img)return;
  const g=cv.getContext('2d'),P=(la,lo)=>map.latLngToContainerPoint([la,lo]),x0=P(0,B.W).x,x1=P(0,B.E).x;
  g.imageSmoothingEnabled=false;
  for(let r=0;r<img.height;r++){const a=P((Y0-r)/K,0).y,b=P((Y0-r-1)/K,0).y;g.drawImage(img,0,r,img.width,1,x0,a,x1-x0,Math.max(1,b-a))}
}
map.on('move zoom resize',draw);
let delay=3,fail=0,eewFail=0;
function tick(){
  if(document.hidden)return;
  const t=new Date(Date.now()-delay*1000),im=new Image();
  im.referrerPolicy='no-referrer';
  im.onload=()=>{img=im;fail=0;draw();$('st').textContent=`表示中: ${stamp(t).replace(/(....)(..)(..)(..)(..)(..)/,'$1/$2/$3 $4:$5:$6')}(1秒ごとに更新)`};
  im.onerror=()=>{if(++fail%3===0)delay=Math.min(delay+1,10);if(fail>=6)$('st').textContent='強震モニターの画像を取得できません(休止中、またはアクセス制限の可能性)'};
  im.src=url('img',t);
  if(eewFail<3)fetch(url('eew',t)).then(r=>r.json()).then(d=>{
    eewFail=0;const e=$('eew');
    if(d.region_name){e.style.display='block';e.textContent=`緊急地震速報 ${d.region_name} M${d.magunitude} 最大震度${d.calcintensity||'?'} 第${d.report_num}報${d.is_training===true||d.is_training==='true'?'(訓練)':''}`}
    else e.style.display='none';
  }).catch(()=>{eewFail++});
}
setInterval(tick,1000);tick();
const SC={10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7'};
async function quakes(){
  try{
    const a=await (await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=6')).json(),ul=$('q');ul.textContent='';
    for(const q of a){const e=q.earthquake||{},h=e.hypocenter||{},li=document.createElement('li');
      li.innerHTML='<b></b> <span></span><br><span class="dim"></span>';
      li.querySelector('b').textContent='震度'+(SC[e.maxScale]||'不明');
      li.children[1].textContent=` ${h.name||'震源不明'} M${h.magnitude>=0?h.magnitude:'?'} 深さ${h.depth>=0?h.depth+'km':'?'}`;
      li.querySelector('.dim').textContent=(e.time||'')+' 発生';ul.appendChild(li)}
  }catch(e){$('q').innerHTML='<li>震度情報を取得できませんでした</li>'}
}
quakes();setInterval(quakes,30000);
if(top!==self)document.getElementById('bk').hidden=true;
</script>
</body>
</html>
