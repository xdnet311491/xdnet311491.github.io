<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ごめんなさい、開発者用機能ですorz</title>
<style>
body{font-family:sans-serif;background:#0a0e2a;color:#eef0ff;max-width:760px;margin:0 auto;padding:1rem}
#stage{position:relative;display:inline-block;line-height:0;cursor:crosshair;max-width:100%}
#stage img{max-width:100%;max-height:60vh;border:1px solid #2b3470}
#dot{position:absolute;width:18px;height:18px;margin:-9px;border:2px solid #ffe27a;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px #000}
#card{height:4.2rem;border:1px solid #2b3470;border-radius:14px;margin:1rem 0;background-size:cover;display:flex;align-items:center;padding:0 1.1rem;font-weight:700}
code{display:block;font-size:1.3rem;background:#141a45;padding:.6rem 1rem;border-radius:8px;user-select:all}
button{padding:.5rem 1rem;margin-top:.6rem}
</style></head><body>
<h1>画像の表示位置ツール</h1>
<p>1. 画像を選ぶ → 2. 見せたい場所をクリック → 3. 下の数字をコピーして fukyou.txt の行の最後に <b>| 50％ 65％</b> の形で貼る</p>
<input type="file" id="f" accept="image/*">
<p><div id="stage"><img id="img" alt=""><div id="dot" hidden></div></div></p>
<p>カードでの見え方 (実際のカードと同じ横長):</p>
<div id="card">プレビュー</div>
<code id="out">50％ 50％</code>
<button id="cp">コピー</button>
<script>
const f=document.getElementById('f'),img=document.getElementById('img'),dot=document.getElementById('dot'),
card=document.getElementById('card'),out=document.getElementById('out'),stage=document.getElementById('stage');
function set(x,y){x=Math.round(Math.max(0,Math.min(100,x)));y=Math.round(Math.max(0,Math.min(100,y)));
 dot.hidden=false;dot.style.left=x+'%';dot.style.top=y+'%';
 card.style.backgroundPosition=x+'% '+y+'%';out.textContent=x+'％ '+y+'％';}
f.onchange=()=>{const a=f.files[0];if(!a)return;img.src=URL.createObjectURL(a);
 img.onload=()=>{card.style.backgroundImage='url('+img.src+')';set(50,50)}};
stage.onclick=e=>{const r=img.getBoundingClientRect();set((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)};
document.getElementById('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(out.textContent);
</script></body></html>
