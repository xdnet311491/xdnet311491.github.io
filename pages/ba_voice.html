function norm(s){
  s = (s || "").normalize("NFKC").toLowerCase();
  s = s.replace(/[\s\u3000・･.\-_'’]/g, "");
  s = s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 96));
  return Array.from(s).map(c => VAR[c] || c).join("");
}
function lev(a, b){
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 1) return 9;
  const d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}

const ACTORS = new Map();
for (const r of DATA) for (const v of r.v) {
  const k = norm(v.n);
  if (!ACTORS.has(k)) ACTORS.set(k, {name: v.n, roles: []});
  const roleOld = v.old;
  ACTORS.get(k).roles.push({c: r.c, collab: r.collab, old: roleOld, now: r.v.filter(x => !x.old).map(x => x.n).join("")});
}

function cleanToken(t){
  t = t.replace(/[（(][^）)]*[）)]/g, "");
  t = t.split(/[:：]/).pop();
  t = t.replace(/^\s*cv\s*/i, "").trim();
  const t2 = t.replace(/(さん|氏|様)$/, "");
  return t2.length >= 2 ? t2 : t;
}
function tokenize(raw){
  const out = [];
  for (const line of raw.split(/[\n,、，\/／;；]+/)) {
    const t = cleanToken(line);
    if (!t) continue;
    const parts = t.split(/[\s\u3000]+/).filter(Boolean);
    if (parts.length >= 2 && !ACTORS.has(norm(t))) {
      // スペースで区切られた複数人: 登録名に合う最長の組み合わせで切り出す
      const got = []; let i = 0, any = false;
      while (i < parts.length) {
        let hit = false;
        for (let j = parts.length; j > i; j--) {
          const cand = parts.slice(i, j).join("");
          if (ACTORS.has(norm(cand))) { got.push(cand); i = j; hit = true; any = true; break; }
        }
        if (!hit) { got.push(parts[i]); i++; }
      }
      if (any) out.push(...got); else out.push(t);
    } else out.push(t);
  }
  return out;
}
function lookup(tok){
  const n = norm(tok);
  if (!n) return null;
  const hit = ACTORS.get(n);
  if (hit) return {hit, cands: []};
  const cands = [];
  for (const [k, a] of ACTORS) {
    if ((n.length >= 2 && k.length >= 2 && (k.includes(n) || n.includes(k))) || (n.length >= 3 && lev(k, n) <= 1)) cands.push(a);
  }
  return {hit: null, cands: cands.slice(0, 4)};
}
function verdict(a){
  const main = a.roles.filter(r => !r.collab && !r.old);
  const col = a.roles.filter(r => r.collab);
  const old = a.roles.filter(r => r.old && !r.collab);
  if (main.length) return "ok";
  if (old.length) return "old";
  if (col.length) return "co";
  return "no";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = {ok:["✅","ブルアカ担当あり"], co:["🟣","コラボ枠のみ"], old:["🕰️","過去に担当(現在は交代)"], no:["❌","リストになし"]};

function roleHtml(a){
  return a.roles.map(r => {
    const tag = r.collab ? "他作品コラボ" : r.old ? "旧担当・現在は" + esc(r.now) : "";
    return "<div>" + esc(r.c) + (tag ? "<span class=\"tag\">(" + tag + ")</span>" : "") + "</div>";
  }).join("");
}
let lastText = "";
function judge(){
  const toks = tokenize(document.getElementById("in").value);
  const out = document.getElementById("out");
  out.innerHTML = "";
  const tally = {ok:0, co:0, old:0, no:0};
  const lines = [];
  const seen = new Set();
  const frag = [];
  for (const tok of toks) {
    const k = norm(tok);
    if (seen.has(k)) continue;
    seen.add(k);
    const r = lookup(tok);
    if (!r) continue;
    if (r.hit) {
      const v = verdict(r.hit);
      tally[v]++;
      frag.push("<div class=\"res " + v + "\"><div class=\"ic\">" + LABEL[v][0] + "</div><div><span class=\"who\">" + esc(r.hit.name) + "</span><span class=\"badge\">" + LABEL[v][1] + "</span><div class=\"chars\">" + roleHtml(r.hit) + "</div></div></div>");
      lines.push(r.hit.name + " … " + LABEL[v][1] + "(" + r.hit.roles.map(x => x.c).join("、") + ")");
    } else {
      tally.no++;
      const mb = r.cands.length ? "<div class=\"maybe dim\">もしかして: " + r.cands.map(a => "<button class=\"sub\" data-name=\"" + esc(a.name) + "\">" + esc(a.name) + "</button>").join("") + "</div>" : "";
      frag.push("<div class=\"res no\"><div class=\"ic\">❌</div><div><span class=\"who\">" + esc(tok) + "</span><span class=\"badge\">" + LABEL.no[1] + "</span><div class=\"chars dim\">登録リストに見つかりません(担当していない可能性が高い)。表記ゆれがないかも確認してください。</div>" + mb + "</div></div>");
      lines.push(tok + " … リストになし");
    }
  }
  if (!frag.length) { out.innerHTML = "<p class=\"dim\">名前を入力してください。</p>"; document.getElementById("cp").hidden = true; return; }
  const total = frag.length;
  const head = total > 1 ? "<div class=\"sum\">" + total + "人中 担当あり " + tally.ok + " / コラボのみ " + tally.co + " / 過去担当 " + tally.old + " / リストなし " + tally.no + "</div>" : "";
  out.innerHTML = head + frag.join("");
  lastText = lines.join("\n");
  document.getElementById("cp").hidden = false;
}
document.getElementById("go").onclick = judge;
document.getElementById("clr").onclick = () => { document.getElementById("in").value = ""; document.getElementById("out").innerHTML = ""; document.getElementById("cp").hidden = true; };
document.getElementById("in").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) judge(); });
document.getElementById("out").addEventListener("click", e => {
  const b = e.target.closest("button[data-name]");
  if (b) { document.getElementById("in").value = b.dataset.name; judge(); }
});
document.getElementById("cp").onclick = async () => {
  try { await navigator.clipboard.writeText(lastText); document.getElementById("cp").textContent = "コピーしました"; setTimeout(() => document.getElementById("cp").textContent = "結果をコピー", 1500); } catch (e) {}
};

// キャラから調べる
function charSearch(){
  const q = norm(document.getElementById("q").value);
  const out = document.getElementById("qout");
  if (!q) { out.innerHTML = ""; return; }
  const hits = DATA.filter(r => norm(r.c).includes(q)).slice(0, 30);
  out.innerHTML = hits.length ? hits.map(r =>
    "<div class=\"res ok\"><div class=\"ic\">🎤</div><div><span class=\"who\">" + esc(r.c) + "</span>" + (r.collab ? "<span class=\"badge\" style=\"background:#c79bff;color:#190a2b\">コラボ</span>" : "") +
    "<div class=\"chars\">" + r.v.map(v => esc(v.n) + (v.old ? "<span class=\"tag\">(旧)</span>" : "")).join(" → ") + "</div></div></div>").join("")
    : "<p class=\"dim\">見つかりません。</p>";
}
document.getElementById("q").addEventListener("input", charSearch);

// タブ
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  for (const x of document.querySelectorAll("#tabs button")) x.classList.toggle("on", x === b);
  document.getElementById("pa").hidden = b.dataset.t !== "a";
  document.getElementById("pb").hidden = b.dataset.t !== "b";
});

// 全一覧
document.getElementById("all").innerHTML = DATA.map(r => "<div>" + esc(r.c) + (r.collab ? "(コラボ)" : "") + " … " + r.v.map(v => esc(v.n)).join(" → ") + "</div>").join("");
</script>
