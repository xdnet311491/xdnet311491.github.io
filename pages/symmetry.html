<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シンメトリ画像メーカー</title>
<meta name="description" content="画像の半分(または1/4)を鏡のように折り返して、左右・上下・四方向対称の画像を作る">
<style>
:root{color-scheme:dark}
body{margin:0;padding:1.2rem;font-family:system-ui,sans-serif;background:#0a0e2a;color:#eef0ff;max-width:760px;margin-inline:auto}
h1{font-size:1.3rem;margin:.2rem 0 1rem}h2{font-size:.9rem;margin:.2rem 0 .4rem;color:#9fb0ff}
.card{background:#141a45;border:1px solid #2c3670;border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.8rem}
.dim{color:#9fb0ff;font-size:.8rem}
.btn,button{font:inherit;font-weight:700;padding:.55rem 1.2rem;border:0;border-radius:999px;background:#7df3ff;color:#06102a;cursor:pointer;display:inline-block}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.3rem 0 .8rem}
.modes button{background:#1d2660;color:#cfd6ff;padding:.5rem .2rem;font-size:.85rem;border:1px solid #2c3670}
.modes button.on{background:#7df3ff;color:#06102a;border-color:#7df3ff}
label.sl{display:grid;grid-template-columns:5.5rem 1fr 3rem;align-items:center;gap:.5rem;font-size:.85rem;margin:.3rem 0}
input[type=range]{width:100%}
canvas{max-width:100%;height:auto;border-radius:10px;border:1px solid #2c3670;background:
 conic-gradient(#555 25%,#777 0 50%,#555 0 75%,#777 0) 0 0/18px 18px}
.row{display:flex;flex-direction:column;gap:.8rem}
</style>
</head>
<body>
<h1>シンメトリ画像メーカー</h1>
<div class="card">
  <label class="btn">画像を選ぶ<input type="file" id="f" accept="image/*" hidden></label>
  <span class="dim">&nbsp;ドラッグ&ドロップでもOK。画像は端末の中だけで処理され、送信されません。</span>
</div>
<div id="ctl" class="card" hidden>
  <h2>どこを使って折り返す?</h2>
  <div class="modes" id="modes"></div>
  <label class="sl" id="lx"><span>中心の位置 横</span><input type="range" id="cx" min="1" max="99" value="50"><b id="vx">50%</b></label>
  <label class="sl" id="ly"><span>中心の位置 縦</span><input type="range" id="cy" min="1" max="99" value="50"><b id="vy">50%</b></label>
  <p class="dim" style="margin:.4rem 0 0">元の画像で暗くなっていない部分が使われ、黄色い線を軸に反対側へ鏡写しされます。</p>
</div>
<div id="wrap" class="row" hidden>
  <div class="card"><h2>元の画像</h2><canvas id="src"></canvas></div>
  <div class="card"><h2>結果</h2><canvas id="out"></canvas><p><button id="dl">PNGで保存</button></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const MODES=[['L','左を使う'],['R','右を使う'],['T','上を使う'],['B','下を使う'],
             ['LT','左上を使う'],['RT','右上を使う'],['LB','左下を使う'],['RB','右下を使う']];
let img=null, mode='L';
MODES.forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.k=k;
  b.onclick=()=>{mode=k;render()};$('modes').appendChild(b)});

function load(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    const M=2500,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(2,Math.round(im.naturalWidth*k));c.height=Math.max(2,Math.round(im.naturalHeight*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c;URL.revokeObjectURL(url);
    $('ctl').hidden=false;$('wrap').hidden=false;render();
  };
  im.onerror=()=>alert('この画像は読み込めませんでした');
  im.src=url;
}
$('f').onchange=e=>load(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});
['cx','cy'].forEach(i=>$(i).oninput=render);

function render(){
  if(!img)return;
  const W=img.width,H=img.height;
  const ax=Math.round(W*$('cx').value/100), ay=Math.round(H*$('cy').value/100);
  $('vx').textContent=$('cx').value+'%';$('vy').textContent=$('cy').value+'%';
  const L=mode.includes('L'),R=mode.includes('R'),T=mode.includes('T'),B=mode.includes('B');
  const hx=L||R, vy=T||B;
  $('lx').style.opacity=hx?1:.35;$('ly').style.opacity=vy?1:.35;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.k===mode));
  // 使う範囲
  const sx=L?0:R?ax:0, sw=L?ax:R?W-ax:W, sy=T?0:B?ay:0, sh=T?ay:B?H-ay:H;
  // 元画像 (使わない部分を暗くして、軸に線を引く)
  const s=$('src');s.width=W;s.height=H;const g=s.getContext('2d');g.drawImage(img,0,0);
  g.fillStyle='rgba(0,0,0,.6)';
  g.fillRect(0,0,W,sy);g.fillRect(0,sy+sh,W,H-sy-sh);g.fillRect(0,sy,sx,sh);g.fillRect(sx+sw,sy,W-sx-sw,sh);
  g.strokeStyle='#ffe27a';g.lineWidth=Math.max(2,Math.round(Math.max(W,H)/400));
  g.beginPath();if(hx){g.moveTo(ax,0);g.lineTo(ax,H)}if(vy){g.moveTo(0,ay);g.lineTo(W,ay)}g.stroke();
  // 結果
  const ow=hx?sw*2:sw, oh=vy?sh*2:sh;
  const o=$('out');o.width=ow;o.height=oh;const c=o.getContext('2d');
  const nx=hx&&R?sw:0, bx=hx?(R?0:sw):0, ny=vy&&B?sh:0, by=vy?(B?0:sh):0;
  const fxs=hx?[false,true]:[false], fys=vy?[false,true]:[false];
  for(const fx of fxs)for(const fy of fys){
    const dx=fx?bx:nx, dy=fy?by:ny;
    c.save();c.translate(dx+(fx?sw:0),dy+(fy?sh:0));c.scale(fx?-1:1,fy?-1:1);
    c.drawImage(img,sx,sy,sw,sh,0,0,sw,sh);c.restore();
  }
}
$('dl').onclick=()=>$('out').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='symmetry.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/png');
</script>
</body>
</html>
