<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背景切り抜きメーカー</title>
<meta name="description" content="画像の背景を消して透明なPNGにする。AI(無料・端末内で処理)と、色で消す方法の2種類">
<style>
:root{color-scheme:dark}
body{margin:0;padding:1.2rem;font-family:system-ui,sans-serif;background:#0a0e2a;color:#eef0ff;max-width:760px;margin-inline:auto}
h1{font-size:1.3rem;margin:.2rem 0 1rem}h2{font-size:.9rem;margin:.2rem 0 .4rem;color:#9fb0ff}
.card{background:#141a45;border:1px solid #2c3670;border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.8rem}
.dim{color:#9fb0ff;font-size:.8rem}
.btn,button{font:inherit;font-weight:700;padding:.55rem 1.2rem;border:0;border-radius:999px;background:#7df3ff;color:#06102a;cursor:pointer;display:inline-block}
button:disabled{opacity:.5;cursor:default}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.3rem 0 .8rem}
.tabs button{background:#1d2660;color:#cfd6ff;border:1px solid #2c3670;border-radius:12px}
.tabs button.on{background:#7df3ff;color:#06102a;border-color:#7df3ff}
label.sl{display:grid;grid-template-columns:7rem 1fr 3rem;align-items:center;gap:.5rem;font-size:.85rem;margin:.3rem 0}
input[type=range]{width:100%}select,input[type=color]{font:inherit;background:#1d2660;color:#eef0ff;border:1px solid #2c3670;border-radius:8px;padding:.25rem .4rem}
canvas{max-width:100%;height:auto;border-radius:10px;border:1px solid #2c3670;display:block}
#src{cursor:crosshair}
.res{display:inline-block;max-width:100%;line-height:0;border-radius:10px;
 background:conic-gradient(#555 25%,#777 0 50%,#555 0 75%,#777 0) 0 0/18px 18px}
#st{min-height:1.4em;color:#ffd479;margin:.5rem 0;white-space:pre-wrap}
.sw{display:inline-block;width:1.1rem;height:1.1rem;border-radius:4px;border:1px solid #fff8;vertical-align:-.2rem}
.hide{display:none!important}
</style>
</head>
<body>
<h1>背景切り抜きメーカー</h1>
<div class="card">
  <label class="btn">画像を選ぶ<input type="file" id="f" accept="image/*" hidden></label>
  <span class="dim">&nbsp;ドラッグ&ドロップでもOK。画像は端末の中だけで処理され、送信されません。</span>
</div>

<div id="ctl" class="card" hidden>
  <div class="tabs"><button id="m-ai" class="on">AIで消す(おすすめ)</button><button id="m-color">色で消す(通信なし)</button></div>

  <div id="p-ai">
    <label class="sl"><span>モデル</span>
      <select id="q"><option value="isnet_quint8">軽量(約45MB・速い)</option><option value="isnet_fp16">高画質(約90MB)</option></select><span></span></label>
    <p class="dim">ブラウザ上で動くAI(@imgly/background-removal)を使います。APIキーも回数制限もありませんが、<b>初回だけモデルをダウンロード</b>します(2回目以降は保存済み)。人物・物・動物などの「主役」を自動で見つけます。</p>
  </div>
  <div id="p-color" class="hide">
    <p class="dim" style="margin-top:0">消したい背景の色を、<b>元の画像をクリック</b>して選びます(選ばない場合は四隅の色を使います)。クリックした場所とつながっている同じ色の部分が消えます。</p>
    <label class="sl"><span>色の許容範囲</span><input type="range" id="tol" min="0" max="100" value="22"><b id="vt">22</b></label>
    <label class="sl"><span>縁のぼかし</span><input type="range" id="soft" min="0" max="100" value="20"><b id="vs">20</b></label>
    <label class="sl"><span>消す範囲</span>
      <select id="cont"><option value="1">端とつながっている部分だけ</option><option value="0">同じ色を全部</option></select><span></span></label>
    <p class="dim">選んだ色: <span class="sw" id="swatch"></span> <span id="swt">自動(四隅)</span></p>
  </div>

  <p><button id="go">背景を消す</button></p>
  <div id="st" role="status" aria-live="polite"></div>
</div>

<div id="wrap" hidden>
  <div class="card"><h2>元の画像</h2><canvas id="src"></canvas></div>
  <div class="card" id="rc" hidden>
    <h2>結果 <select id="bg" style="margin-left:.5rem">
      <option value="check">透明(市松)</option><option value="#ffffff">白</option><option value="#000000">黒</option>
      <option value="#00b050">緑</option><option value="#ff6fa5">ピンク</option></select></h2>
    <div class="res" id="res"><canvas id="out"></canvas></div>
    <p><button id="dl">透明PNGで保存</button></p>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let src=null, mode='ai', picked=null, pickedPos=null, busy=false, lib=null;

function setMode(m){
  mode=m;$('m-ai').classList.toggle('on',m==='ai');$('m-color').classList.toggle('on',m==='color');
  $('p-ai').classList.toggle('hide',m!=='ai');$('p-color').classList.toggle('hide',m!=='color');
  $('src').style.cursor=m==='color'?'crosshair':'default';
}
$('m-ai').onclick=()=>setMode('ai');$('m-color').onclick=()=>setMode('color');

function load(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    const M=2000,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=c;URL.revokeObjectURL(url);
    const s=$('src');s.width=c.width;s.height=c.height;s.getContext('2d').drawImage(c,0,0);
    picked=null;pickedPos=null;$('swatch').style.background='transparent';$('swt').textContent='自動(四隅)';
    $('ctl').hidden=false;$('wrap').hidden=false;$('rc').hidden=true;$('st').textContent='';
  };
  im.onerror=()=>alert('この画像は読み込めませんでした');
  im.src=url;
}
$('f').onchange=e=>load(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});

// 元画像をクリックして背景色を選ぶ
$('src').addEventListener('click',e=>{
  if(mode!=='color'||!src)return;
  const r=$('src').getBoundingClientRect();
  const x=Math.min(src.width-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*src.width)));
  const y=Math.min(src.height-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*src.height)));
  const d=src.getContext('2d').getImageData(x,y,1,1).data;
  picked=[d[0],d[1],d[2]];pickedPos=y*src.width+x;showPicked();runColor();
});
function showPicked(c){c=c||picked;$('swatch').style.background=`rgb(${c})`;$('swt').textContent=picked?`rgb(${c.join(', ')})`:`自動 rgb(${c.join(', ')})`}

// ---------- 色で消す ----------
function autoColor(d,w,h){
  const n=Math.max(1,Math.min(8,Math.floor(Math.min(w,h)/10))),ch=[[],[],[]];
  for(const [ox,oy] of [[0,0],[w-n,0],[0,h-n],[w-n,h-n]])
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=((oy+y)*w+ox+x)*4;ch[0].push(d[i]);ch[1].push(d[i+1]);ch[2].push(d[i+2])}
  return ch.map(a=>{a.sort((p,q)=>p-q);return a[a.length>>1]});
}
function runColor(){
  if(!src)return;
  const w=src.width,h=src.height,id=src.getContext('2d').getImageData(0,0,w,h),d=id.data;
  const c=picked||autoColor(d,w,h);if(!picked)showPicked(c);
  const thr=$('tol').value/100*220, soft=Math.max(0.5,$('soft').value/100*90), lim=thr+soft;
  $('vt').textContent=$('tol').value;$('vs').textContent=$('soft').value;
  const dist=i=>{const a=d[i]-c[0],b=d[i+1]-c[1],e=d[i+2]-c[2];return Math.sqrt(a*a+b*b+e*e)};
  const setA=(i,dd)=>{d[i+3]=dd<=thr?0:dd>=lim?255:Math.round((dd-thr)/soft*255)};
  if($('cont').value==='1'){
    const seen=new Uint8Array(w*h),q=new Int32Array(w*h);let qh=0,qt=0;
    const push=p=>{if(!seen[p]&&dist(p*4)<=lim){seen[p]=1;q[qt++]=p}};
    if(picked&&pickedPos!=null)push(pickedPos);   // クリックした場所からも広げる
    for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}
    for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    while(qh<qt){const p=q[qh++],x=p%w,y=(p-x)/w;
      setA(p*4,dist(p*4));
      if(x>0)push(p-1);if(x<w-1)push(p+1);if(y>0)push(p-w);if(y<h-1)push(p+w)}
  }else{
    for(let i=0;i<d.length;i+=4)setA(i,dist(i));
  }
  show(id);$('st').textContent='完了。結果が思わしくなければ、許容範囲を動かすか、別の場所をクリックしてください。';
}

// ---------- AIで消す ----------
async function loadLib(){
  if(lib)return lib;let err;
  for(const u of ['https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm','https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm']){
    try{const m=await import(u);if(m.removeBackground){lib=m;return lib}}catch(e){err=e}
  }
  throw err||new Error('load failed');
}
async function runAI(){
  $('st').textContent='AIを読み込み中…(初回はモデルのダウンロードで少し時間がかかります)';
  const m=await loadLib();
  const blob=await new Promise(r=>src.toBlob(r,'image/png'));
  const out=await m.removeBackground(blob,{model:$('q').value,output:{format:'image/png'},
    progress:(key,cur,tot)=>{if(tot)$('st').textContent=`処理中… ${String(key).replace(/^fetch:/,'ダウンロード: ')} ${Math.round(cur/tot*100)}%`}});
  const bmp=await createImageBitmap(out);
  const o=$('out');o.width=bmp.width;o.height=bmp.height;o.getContext('2d').drawImage(bmp,0,0);
  $('rc').hidden=false;setBg();$('st').textContent='完了。背景の色を切り替えて、切り抜きの縁を確認できます。';
}

function show(imageData){const o=$('out');o.width=imageData.width;o.height=imageData.height;o.getContext('2d').putImageData(imageData,0,0);$('rc').hidden=false;setBg()}
function setBg(){const v=$('bg').value,r=$('res');
  if(v==='check'){r.style.background='';}else{r.style.background=v}}
$('bg').onchange=setBg;

$('go').onclick=async()=>{
  if(!src||busy)return;busy=true;$('go').disabled=true;
  try{ if(mode==='ai')await runAI();else runColor(); }
  catch(e){console.error(e);$('st').textContent='AIの読み込みや処理に失敗しました。通信が止められている(学校・会社のフィルターなど)か、端末のメモリ不足の可能性があります。\n「色で消す」なら通信なしで使えます。';}
  busy=false;$('go').disabled=false;
};
let t=null;['tol','soft'].forEach(i=>$(i).oninput=()=>{$('vt').textContent=$('tol').value;$('vs').textContent=$('soft').value;
  if(mode==='color'&&!$('rc').hidden){clearTimeout(t);t=setTimeout(runColor,80)}});
$('cont').onchange=()=>{if(mode==='color'&&!$('rc').hidden)runColor()};
$('dl').onclick=()=>$('out').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='cutout.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/png');
</script>
</body>
</html>
